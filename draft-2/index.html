<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <script defer src="./js/index.js" type="module"></script>
    <link
      rel="shortcut icon"
      href="./icons/karaoke-favicon.ico.svg"
      type="image/x-icon"
    />
    <title>Xarizma</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a href="" class="logo header__logo">
          <img
            src="./icons/logo-icon.svg"
            width="293"
            height="67"
            alt="Харизма"
          />
        </a>
        <div class="header__menu header__menu--open" id="header__menu">
          <nav
            class="contacts header__contacts"
            aria-label="Контакты и геолокация"
          >
            <ul class="contacts__list">
              <li class="contacts__item">
                <a class="contacts__link" href="tel:+380979709090">
                  <svg width="29" height="29">
                    <use
                      class="header__contacts-icon"
                      href="./icons/sprite.svg#phone"
                    ></use>
                  </svg>
                  <span class="contacts__link-text">
                    +38 (097) 970-90-90
                  </span></a
                >
              </li>
              <li class="contacts__item">
                <a class="contacts__geo-link" href="#">
                  <svg width="34" height="34">
                    <use
                      class="header__contacts-icon"
                      href="./icons/sprite.svg#geo"
                    ></use>
                  </svg>
                  <span class="contacts__geo-link-text"> м. Лубянка</span></a
                >
              </li>
            </ul>
          </nav>
          <nav class="actions header__actions">
            <ul class="actions__list">
              <li class="actions__item actions__link">
                <a class="actions__link" href="#halls">
                  <button>
                    <img src="./icons/halls-button.svg" alt="Наши залы" />
                  </button>
                </a>
              </li>
              <li class="actions__item actions__link">
                <a class="actions__link" href="#book">
                  <button>
                    <img src="./icons/book-button.svg" alt="Забронировать" />
                  </button>
                </a>
              </li>
            </ul>
          </nav>
        </div>
        <button
          class="burger header__burger"
          aria-label="Открыть меню"
          aria-expanded="false"
          aria-controls="header__menu"
        >
          <svg width="29" height="12">
            <use
              class="burger__icon-menu"
              href="./icons/sprite.svg#burger"
            ></use>
            <use
              class="burger__icon-cross"
              href="./icons/sprite.svg#cross"
            ></use>
          </svg>
        </button>
      </div>
    </header>
  </body>
</html>
